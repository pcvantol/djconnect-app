name: Public signed macOS release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact approved source commit on main
        type: string
        required: true
      version:
        description: Existing macOS release version
        type: string
        required: true
      build_number:
        description: macOS CFBundleVersion
        type: string
        required: true
      publish:
        description: Attach the verified ZIP and checksum to the public release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: djconnect-public-signed-macos-release
  cancel-in-progress: false

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: release
      owner: pcvantol/djconnect-app

  signed-macos:
    name: Build and notarize on the Apple release runner
    needs: software-assurance-governance
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, internal-release, qualification, apple, macmini-build]
    timeout-minutes: 60
    environment: apple-secure-distribution
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      NOTARY_PROFILE: DJConnect-Public-macOS
      DEVELOPMENT_TEAM: ZEML4LPXH4
    steps:
      - name: Validate the dispatch
        env:
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          test "$ACTOR_ID" = 19624891
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          printf '%s' "$RELEASE_BUILD_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated release output and confirm local signing
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git status --porcelain)" = ""
          declared_version="$(awk -F'"' '/^[[:space:]]+MARKETING_VERSION:/ {print $2; exit}' project.yml)"
          test "$declared_version" = "$RELEASE_VERSION"
          work="$(mktemp -d '/Volumes/Shared Data/tmp/pcvantol/djconnect-signed-macos-ci.XXXXXXXX')"
          mkdir "$work/tmp"
          {
            printf 'SIGNED_RELEASE_DIR=%s\n' "$work"
            printf 'TMPDIR=%s\n' "$work/tmp"
            printf 'DEVELOPER_DIR=%s\n' /Applications/Xcode.app/Contents/Developer
          } >> "$GITHUB_ENV"
          security find-identity -v -p codesigning > "$work/signing-identities.txt"
          grep -Eq 'Developer ID Application:.*\(ZEML4LPXH4\)' "$work/signing-identities.txt"
          if ! xcrun notarytool history --keychain-profile "$NOTARY_PROFILE" --output-format json >/dev/null; then
            echo "::error::The Apple runner requires the DJConnect-Public-macOS notarization keychain profile."
            exit 1
          fi
      - name: Build, sign and notarize the exact source
        env:
          DJCONNECT_SKIP_SYSTEM_TOOL_UPGRADE: "1"
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$SIGNED_RELEASE_DIR/DJConnect.xcarchive" \
          EXPORT_PATH="$SIGNED_RELEASE_DIR/export" \
          ARTIFACTS_PATH="$SIGNED_RELEASE_DIR/artifacts" \
          DERIVED_DATA_PATH="$SIGNED_RELEASE_DIR/DerivedData" \
            bash Tools/release/release_macos_public.sh --version "$RELEASE_VERSION" --skip-upload
          git diff --exit-code
      - name: Verify the distributable ZIP
        run: |
          set -euo pipefail
          cd "$SIGNED_RELEASE_DIR/artifacts"
          zip="DJConnect-macOS-$RELEASE_VERSION.zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          mkdir "$SIGNED_RELEASE_DIR/verification"
          ditto -x -k "$zip" "$SIGNED_RELEASE_DIR/verification"
          app="$SIGNED_RELEASE_DIR/verification/DJConnect.app"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = dev.djconnect.mac
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" = "$RELEASE_BUILD_NUMBER"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" > "$SIGNED_RELEASE_DIR/signature.txt" 2>&1
          grep -Eq '^Authority=Developer ID Application: .*\(ZEML4LPXH4\)$' "$SIGNED_RELEASE_DIR/signature.txt"
          grep -Fx "TeamIdentifier=$DEVELOPMENT_TEAM" "$SIGNED_RELEASE_DIR/signature.txt"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun lipo "$app/Contents/MacOS/DJConnect" -verify_arch arm64
          xcrun lipo "$app/Contents/MacOS/DJConnect" -verify_arch x86_64
          {
            printf 'source_sha=%s\nversion=%s\nbuild_number=%s\n' "$CANDIDATE_SHA" "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"
            cat "$zip.sha256"
          } > "$SIGNED_RELEASE_DIR/artifacts/provenance.txt"
      - name: Retain verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-macos-verification-${{ inputs.version }}-${{ inputs.build_number }}
          path: |
            ${{ env.SIGNED_RELEASE_DIR }}/artifacts/provenance.txt
            ${{ env.SIGNED_RELEASE_DIR }}/artifacts/notarization.json
            ${{ env.SIGNED_RELEASE_DIR }}/signature.txt
          if-no-files-found: error
      - name: Publish the verified package
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: bash Tools/release/publish_macos_signed_asset.sh
