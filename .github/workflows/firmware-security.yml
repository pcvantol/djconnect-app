name: Firmware security scan

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-app

  semgrep:
    name: Semgrep
    uses: pcvantol/djconnect/.github/workflows/djconnect-semgrep-ci.yml@191b4561bdb659bd2e02905b5bce9643d4390a63 # Repaired reachable workflow closure
    with:
      continue-on-error: true
