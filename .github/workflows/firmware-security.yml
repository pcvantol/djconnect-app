name: Firmware security scan

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-aabd.yml@4025a68add8ba98f1f2e0307d7f3998e45c0d9ef
    with:
      execution_profile: balanced
      owner: ${{ github.repository }}

  semgrep:
    name: Semgrep
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/djconnect-semgrep-191.yml@4025a68add8ba98f1f2e0307d7f3998e45c0d9ef # Repaired reachable workflow closure
    with:
      continue-on-error: true
