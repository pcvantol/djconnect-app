name: Apple E2E fixtures

on:
  workflow_dispatch:
    inputs:
      vibecast_origin:
        description: Optional HTTPS HA-dev origin for the VibeCast browser fixture
        type: string

permissions:
  contents: read

concurrency:
  group: apple-e2e-fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-smoke:
    name: Native fixture smoke (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [iphone, ipad, mac, watch-contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run selected native fixture tests
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          unset DJCONNECT_ASKDJ_GOLDEN_PLAN DJCONNECT_ASKDJ_GOLDEN_OUTPUT
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          scratch="$RUNNER_TEMP/apple-e2e-$PLATFORM"
          mkdir -p "$scratch/tmp"
          export TMPDIR="$scratch/tmp"
          xcodebuild -version

          scheme=DJConnectMac
          destination=platform=macOS
          minimum_passes=2
          case "$PLATFORM" in
            iphone|ipad)
              scheme=DJConnectIOS
              model="iPhone 17 Pro"
              family=iPhone
              if [[ "$PLATFORM" == ipad ]]; then model="iPad mini (A17 Pro)"; family=iPad; fi
              # Prefer the named model, then use an installed device of the same family.
              id="$(xcrun simctl list devices available -j | jq -er --arg model "$model" --arg family "$family" '
                [.devices | to_entries[] | select(.key | contains(".iOS-"))
                  | .key as $runtime | .value[] | select((.name | startswith($family)) and .isAvailable)
                  | {udid, preferred: (.name == $model), version: ($runtime | split(".iOS-")[1] | split("-") | map(tonumber))}]
                | sort_by(.preferred, .version, .udid) | last | .udid')"
              destination="platform=iOS Simulator,id=$id"
              tests=(
                -only-testing:DJConnectIOSUITests/DJConnectIOSUITests/testSessionAvatarStaysInsideSingleCurrentCard
                -only-testing:DJConnectIOSUITests/DJConnectIOSUITests/testSessionConversationContextMenuReusesPromptAndReportsAnswer
                -only-testing:DJConnectIOSUITests/DJConnectIOSUITests/testVibeCastCenteredBlockingDialogAndGenericCopy
              )
              ;;
            mac)
              tests=(
                -only-testing:DJConnectMacUITests/DJConnectMacUITests/testAskDJNavigationKeepsSidebarAndComposerInsideWindow
                -only-testing:DJConnectMacUITests/DJConnectMacUITests/testReviewDemoSessionAvatarLayoutFavoriteAndArtworkControls
              )
              ;;
            watch-contract)
              tests=(
                '-only-testing:DJConnectCoreTests/watchMomentAlertLocatorRejectsOtherFamiliesAndNeverCarriesAuthority()'
                '-only-testing:DJConnectCoreTests/watchRetainedMomentOpenUsesOriginalPublicationAndRejectsAnotherID()'
                '-only-testing:DJConnectCoreTests/watchVoiceCompanionFreezesExplicitOriginalContextAndOperationID()'
              )
              minimum_passes=3
              ;;
          esac

          common=(-project DJConnectApp.xcodeproj -scheme "$scheme" -configuration Debug
                  -destination "$destination" -parallel-testing-enabled NO
                  -derivedDataPath "$scratch/derived" CODE_SIGNING_ALLOWED=NO)
          mkdir -p "$scratch/results"
          run_tests() {
            local action="$1" output="$2" minimum="$3" allowance="$4"
            shift 4
            mkdir -p "$output"
            xcodebuild "$action" "${common[@]}" \
              -test-timeouts-enabled YES -maximum-test-execution-time-allowance "$allowance" \
              -resultBundlePath "$output/tests.xcresult" "$@" 2>&1 | tee "$output/xcodebuild.log"
            xcrun xcresulttool get test-results summary --path "$output/tests.xcresult" > "$output/summary.json"
            jq -e --argjson minimum "$minimum" '
              .passedTests >= $minimum and .failedTests == 0 and .skippedTests == 0
            ' "$output/summary.json"
          }

          if [[ "$PLATFORM" == iphone || "$PLATFORM" == ipad ]]; then
            xcodebuild build-for-testing "${common[@]}" 2>&1 | tee "$scratch/results/build.log"
            xcrun simctl bootstatus "$id" -b
            # Cold simulator UI startup plus the conversation round trip has exceeded
            # two minutes on both mobile devices even when the assertions pass.
            run_tests test-without-building "$scratch/results/avatar" 1 300 "${tests[0]}"
            # XCTest has failed to terminate the previous app while launching the next case.
            # Restart only this job's simulator before reusing the same build.
            state="$(xcrun simctl list devices -j | jq -er --arg id "$id" '
              [.devices[][] | select(.udid == $id)] | if length == 1 then .[0].state else error("simulator not found") end')"
            if [[ "$state" != Shutdown ]]; then xcrun simctl shutdown "$id"; fi
            xcrun simctl bootstatus "$id" -b
            context_allowance=120
            # The hosted iPhone can spend a full minute waiting for UI idle
            # during a swipe. Keep the case bounded without truncating its assertions.
            if [[ "$PLATFORM" == iphone ]]; then context_allowance=300; fi
            run_tests test-without-building "$scratch/results/vibecast" 1 300 "${tests[2]}"
            state="$(xcrun simctl list devices -j | jq -er --arg id "$id" '
              [.devices[][] | select(.udid == $id)] | if length == 1 then .[0].state else error("simulator not found") end')"
            if [[ "$state" != Shutdown ]]; then xcrun simctl shutdown "$id"; fi
            xcrun simctl bootstatus "$id" -b
            run_tests test-without-building "$scratch/results/context-menu" 1 "$context_allowance" "${tests[1]}"
          else
            run_tests test "$scratch/results/smoke" "$minimum_passes" 120 "${tests[@]}"
          fi

      - name: Upload synthetic fixture results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-e2e-fixtures-${{ matrix.platform }}
          path: ${{ runner.temp }}/apple-e2e-${{ matrix.platform }}/results/
          if-no-files-found: error
          retention-days: 7

  vibecast-browser:
    name: VibeCast shared display (WebKit)
    if: inputs.vibecast_origin != ''
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run VibeCast display fixture
        env:
          DJCONNECT_VIBECAST_TEST_ORIGIN: ${{ inputs.vibecast_origin }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/vibecast-browser"
          mkdir -p "$scratch"
          npm install --prefix "$scratch" --no-audit --no-fund --ignore-scripts --save-exact playwright@1.61.0
          "$scratch/node_modules/.bin/playwright" install webkit
          NODE_PATH="$scratch/node_modules" node Tools/qualification/vibecast-product/test_shared_display.cjs
